[project]
name = "persona-bot-api"
version = "0.1.0"
description = "Backend API for the Persona Bot capstone project."
readme = "README.md"
authors = [
    { name = "digitalslav", email = "ivanov.daniel4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
