[project]
name = "langan-knowledge-bot"
version = "0.1.0"
description = "Chatbot that answers questions from retired employees' project documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "scalar-fastapi>=1.9.1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "tiktoken>=0.9,<1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
